<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SCP Entry: Loom of Fate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              mono: ['"JetBrains Mono"', 'monospace'],
              report: ['"Special Elite"', 'cursive'],
            },
            colors: {
              scp: {
                dark: '#0a0a0a',
                gray: '#1a1a1a',
                accent: '#c32e20', // Alert Red
                text: '#e0e0e0',
                term: '#33ff00',
                term_fix: '#33ff00',
              }
            },
            animation: {
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'scanline': 'scanline 8s linear infinite',
              'radar-spin': 'radar-spin 4s linear infinite',
              'blip-pulse': 'blip-pulse 2s cubic-bezier(0, 0, 0.2, 1) infinite',
            },
            keyframes: {
              scanline: {
                '0%': { transform: 'translateY(-100%)' },
                '100%': { transform: 'translateY(100%)' }
              },
              'radar-spin': {
                '0%': { transform: 'rotate(0deg)' },
                '100%': { transform: 'rotate(360deg)' }
              },
              'blip-pulse': {
                '0%': { transform: 'scale(1)', opacity: '1' },
                '70%': { transform: 'scale(2)', opacity: '0' },
                '100%': { transform: 'scale(1)', opacity: '0' }
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --scp-bg: #050505;
        --scp-surface: #0a0a0a;
        --scp-surface-2: #111111;
        --scp-border: rgba(90, 90, 90, 0.45);
        --scp-border-strong: rgba(120, 120, 120, 0.75);
        --scp-text: #e0e0e0;
        --scp-text-dim: rgba(224, 224, 224, 0.6);
        --scp-term: #33ff00;
        --scp-amber: #d9a441;
        --scp-alert: #c32e2e;
        --scp-shadow: 0 0 22px rgba(0, 0, 0, 0.6);
        --scp-glow: 0 0 10px rgba(51, 255, 0, 0.35);
        --scp-scanline-dark: rgba(0, 0, 0, 0.28);
        --scp-scanline-rgb-r: rgba(255, 0, 0, 0.04);
        --scp-scanline-rgb-g: rgba(0, 255, 0, 0.02);
        --scp-scanline-rgb-b: rgba(0, 0, 255, 0.04);
        --scp-scrollbar-track: #1a1a1a;
        --scp-scrollbar-thumb: #333333;
        --scp-noise-opacity: 0.12;
      }
      body {
        background-color: var(--scp-bg);
        color: var(--scp-text);
        overflow: hidden;
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--scp-scrollbar-track);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--scp-scrollbar-thumb);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--theme-accent, var(--scp-alert));
      }
      .scp-ui {
        color: var(--scp-text);
        letter-spacing: 0.02em;
      }
      .scp-window {
        background: rgba(10, 10, 10, 0.85);
        border: 1px solid var(--scp-border);
        box-shadow: var(--scp-shadow);
        backdrop-filter: blur(8px);
      }
      .scp-window-header {
        background: linear-gradient(90deg, rgba(30, 30, 30, 0.6), rgba(10, 10, 10, 0.2));
        border-bottom: 1px solid var(--scp-border);
        color: var(--scp-text);
        text-transform: uppercase;
        letter-spacing: 0.22em;
      }
      .scp-archive {
        background: #0b0b0b;
        border: 1px solid var(--scp-border-strong);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04), var(--scp-shadow);
      }
      .reading-pane {
        text-shadow: none;
      }
      .reading-pane .typewriter-container {
        max-width: 42rem;
      }
      .scp-alert {
        border: 1px solid rgba(195, 46, 46, 0.7);
        box-shadow: 0 0 18px rgba(195, 46, 46, 0.25);
      }
      .scp-divider {
        height: 1px;
        background: linear-gradient(90deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.05));
      }
      .scp-badge {
        border: 1px solid var(--scp-border);
        background: rgba(0, 0, 0, 0.5);
        color: var(--scp-text-dim);
        text-transform: uppercase;
        letter-spacing: 0.3em;
      }
      .scp-noise {
        background-image: url('https://www.transparenttextures.com/patterns/noise-lines.png');
        opacity: var(--scp-noise-opacity);
      }
      .crt::before {
        content: " ";
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, var(--scp-scanline-dark) 50%), linear-gradient(90deg, var(--scp-scanline-rgb-r), var(--scp-scanline-rgb-g), var(--scp-scanline-rgb-b));
        z-index: 2;
        background-size: 100% 2px, 3px 100%;
        pointer-events: none;
      }
      .text-shadow-green {
        text-shadow: 0 0 5px rgba(51, 255, 0, 0.45);
      }
      .text-shadow-sm {
        text-shadow: 0 0 3px rgba(224, 224, 224, 0.28);
      }
      @keyframes scp-stroke {
        from {
          stroke-dashoffset: 0;
        }
        to {
          stroke-dashoffset: -2000;
        }
      }
      @keyframes scp-cycle {
        0% {
          stroke-dasharray: 0 1000;
          opacity: 1;
        }
        45% {
          stroke-dasharray: 1000 0;
          opacity: 1;
        }
        55% {
          stroke-dasharray: 1000 0;
          opacity: 1;
        }
        100% {
          stroke-dasharray: 1000 0;
          opacity: 0;
        }
      }
      .scp-stroke-anim {
        fill: none;
        stroke-width: 20;
        stroke-linecap: round;
        stroke-dasharray: 0 1000;
        stroke-dashoffset: 500; /* 从中心开始 */
        animation: scp-cycle 2s ease infinite;
      }
      .radar-sweep {
        background: conic-gradient(
          from 0deg,
          transparent 0deg,
          transparent 270deg,
          rgba(51, 255, 0, 0.1) 310deg,
          rgba(51, 255, 0, 0.4) 360deg
        );
        border-radius: 50%;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "react-markdown": "https://aistudiocdn.com/react-markdown@^10.1.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "rehype-raw": "https://esm.sh/rehype-raw@^7.0.0",
    "rehype-sanitize": "https://esm.sh/rehype-sanitize@^6.0.0",
    "hast-util-sanitize": "https://esm.sh/hast-util-sanitize@^5.0.2",
    "react-markdown/": "https://esm.sh/react-markdown@^10.1.0/",
    "react-dom": "https://esm.sh/react-dom@^19.2.3",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.89.0",
    "pako": "https://esm.sh/pako@^2.1.0",
    "@supabase/auth-ui-react": "https://esm.sh/@supabase/auth-ui-react@^0.4.7",
    "@supabase/auth-ui-shared": "https://esm.sh/@supabase/auth-ui-shared@^0.1.8"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
